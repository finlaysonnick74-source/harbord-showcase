<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Table card · Harbord Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
<style>
body{display:flex;flex-direction:column;align-items:center;padding:30px 16px;gap:18px}
.card{width:100mm;height:148mm;background:var(--cream);border-radius:50mm 50mm 6mm 6mm;border:2.5px solid var(--terra);outline:1.5px solid var(--terra);outline-offset:-9px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14mm 10mm 10mm;box-shadow:0 18px 40px rgba(90,46,28,.18)}
.card .sun{width:40mm;height:20mm;margin-bottom:5mm}
.card h1{font-size:13mm;line-height:.9;color:var(--terra)}
.card .eyebrow{font-size:3mm;margin-bottom:3mm}
.qr{width:44mm;height:44mm;padding:3.5mm;background:var(--paper);border-radius:4mm;margin:6mm 0 4mm}.qr svg{width:100%;height:100%;display:block}
.scan{font-size:5mm;color:var(--brown)}.sm{font-style:italic;font-size:3.1mm;color:var(--olive);margin-top:1.5mm}
.tbl{margin-top:5mm;font-size:3mm;letter-spacing:.24em;color:var(--teal)}
.act{display:flex;gap:10px}.act button{background:var(--terra);color:var(--paper);padding:10px 20px;border-radius:999px}
@media print{#qrurl{display:none}@page{size:A6;margin:0}body{padding:0;background:#fff}.act{display:none}.card{box-shadow:none;margin:0 auto}}
</style></head><body>
<div class="card"><div class="sun" aria-hidden="true"></div><div class="eyebrow hd">Freshwater · Since 1928</div><h1 class="hd">Harbord<br>Hotel</h1>
<div class="qr" role="img" aria-label="QR code for the Harbord Hotel menu" id="qr">

</div>
<div class="scan hd">Scan to order</div><div class="sm">Food, drinks & Bombies rooftop, brought to your table.</div><div class="tbl hd"><span id="tno"></span> · 29 Moore Rd</div></div>
<div class="act"><button class="hd" onclick="print()">Print table card</button></div>
<p class="sm" id="qrurl" style="max-width:100mm;text-align:center"></p>
<script src="../assets/vendor/qrcode.js"></script><script>
const tn=(new URLSearchParams(location.search).get('table')||'12').replace(/[^0-9A-Za-z]/g,'').slice(0,4);const url=new URL('./?table='+tn,location.href).href;document.getElementById('tno').textContent='Table '+tn;const q=qrcode(0,'H');q.addData(url);q.make();
const n=q.getModuleCount(),c=[];for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))c.push(`M${k} ${r}h1v1h-1z`);
document.getElementById('qr').innerHTML=`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path fill="#5A2E1C" d="${c.join('')}"/></svg>`;
document.getElementById('qrurl').textContent='Opens '+url.replace(/^https?:\/\//,'');
</script></body></html>
